<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icon-day-app.png">
<link rel="icon" type="image/png" href="icon-day-app.png">
<title>スタンプ置き場（サンプル）</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #fff7fa; color: #333; }
  header { background: #ff5c8a; color: #fff; padding: 12px 16px; font-size: 19px; font-weight: bold; }
  .search { padding: 10px 12px; }
  .search input { width: 100%; box-sizing: border-box; font-size: 17px; padding: 11px; border: 2px solid #ff5c8a; border-radius: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 12px 16px; }
  .btn { background: #fff; border: 2px solid #ffb3c9; border-radius: 12px; padding: 14px 8px;
         font-size: 16px; font-weight: bold; text-align: center; color: #333; }
  .btn:active { background: #ffe3ee; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 10; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 14px; }
  .sheet .phrase { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .sheet video { width: 100%; max-height: 52vh; border-radius: 8px; background: #000; }
  .send { display: block; width: 100%; margin-top: 10px; padding: 14px; font-size: 17px; font-weight: bold;
          color: #fff; background: linear-gradient(180deg, #ff7ba3, #ff5c8a); border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(255,92,138,.35); }
  .close { display: block; width: 100%; margin-top: 8px; padding: 11px; font-size: 15px;
           background: #eee; border: none; border-radius: 10px; }
</style>
</head>
<body>
<header>スタンプ置き場（サンプル）</header>
<div class="grid" id="grid"></div>
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="phrase" id="sh-phrase"></div>
    <video id="sh-video" playsinline controls></video>
    <button class="send" id="sh-send">送る</button>
    <button class="close" id="sh-close">閉じる</button>
  </div>
</div>
<script>
  var items = [
    ["lib-01", "おはようございます"], ["lib-02", "お知らせです、お願いします"], ["lib-03", "了解です"],
    ["lib-04", "書類、確認お願いします"], ["lib-05", "見積書、できました"], ["lib-06", "請求書、送りました"],
    ["lib-07", "締め切り、明日までです"], ["lib-08", "会議、始まります"], ["lib-09", "ありがとうございます、助かります"],
    ["lib-10", "お疲れさまです、もう一息です"], ["lib-11", "確認しました"], ["lib-12", "少々お待ちください"],
    ["lib-13", "お任せください"], ["lib-14", "写真、送ってください"], ["lib-15", "雨で中止です"],
    ["lib-16", "安全第一でお願いします"], ["lib-17", "変更がありました"], ["lib-18", "手配しました"],
    ["lib-19", "あとで電話します"], ["lib-20", "明日もよろしくお願いします"]
  ];
  var grid = document.getElementById('grid');
  var overlay = document.getElementById('overlay');
  var shVideo = document.getElementById('sh-video');
  var current = null;
  function render(filter) {
    grid.innerHTML = '';
    items.forEach(function(it) {
      if (filter && it[1].indexOf(filter) < 0) return;
      var b = document.createElement('button');
      b.className = 'btn';
      b.textContent = it[1];
      b.addEventListener('click', function() { openSheet(it); });
      grid.appendChild(b);
    });
  }
  function openSheet(it) {
    current = it;
    document.getElementById('sh-phrase').textContent = it[1];
    shVideo.src = 'lib-' + it[0] + '.mp4';
    overlay.style.display = 'block';
    shVideo.play().catch(function() {});
  }
  function closeSheet() {
    shVideo.pause();
    shVideo.removeAttribute('src'); shVideo.load();
    overlay.style.display = 'none';
  }
  document.getElementById('sh-close').addEventListener('click', closeSheet);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeSheet(); });
    document.getElementById('sh-send').addEventListener('click', function() {
    if (!current) return;
    var url = 'lib-' + current[0] + '.mp4';
    var phrase = current[1];
    fetch(url).then(function(r) { return r.blob(); }).then(function(blob) {
      var file = new File([blob], phrase + '.mp4', { type: 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() {});
      } else if (navigator.share) {
        navigator.share({ url: new URL(url, location.href).href }).catch(function() {});
      } else {
        location.href = url;
      }
    }).catch(function() { location.href = url; });
  });
  render('');
</script>
</body>
</html>
